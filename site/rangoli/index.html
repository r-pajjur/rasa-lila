<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Petal Mandala</title>
<meta name="description" content="Draw a small rangoli for the community Diwali mandala." />
<meta name="theme-color" content="#FBF4E4" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Mukta:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="style.css" />
<style>
  .page {
    position: relative;
    z-index: 1;
    max-width: 1040px;
    margin: 0 auto;
    padding:
      calc(env(safe-area-inset-top, 0px) + 14px)
      max(16px, env(safe-area-inset-right, 0px))
      calc(env(safe-area-inset-bottom, 0px) + 20px)
      max(16px, env(safe-area-inset-left, 0px));
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* phone: one column. computer: circle on the left, tools on the right */
  .workspace { display: flex; flex-direction: column; gap: 12px; }
  .controls { display: flex; flex-direction: column; gap: 12px; }

  /* on a phone the drawing can't scroll the page, so a strip beside it always does */
  .stage-row { display: flex; justify-content: center; align-items: stretch; gap: 10px; }
  .scroller {
    flex: 0 0 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border: 1.5px dashed var(--ink-soft);
    border-radius: 25px;
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 600;
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
  }
  .scroller span { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .06em; }
  .scroller svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .stage {
    position: relative;
    width: min(calc(100vw - 92px), 62vh, 520px);
    aspect-ratio: 1;
    flex: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage canvas.top { pointer-events: none; }

  .hint { margin: 0; text-align: center; font-size: 15px; line-height: 1.35; color: var(--ink-soft); }
  .hint b { color: var(--gold-text); }

  .swatches { display: grid; grid-template-columns: repeat(6, 44px); justify-content: space-between; gap: 10px 6px; }
  .swatch {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: var(--border);
    background: var(--c);
    cursor: pointer;
    padding: 0;
  }
  .swatch[aria-pressed="true"] { border: 3px solid var(--paper); box-shadow: 0 0 0 2px var(--ink), 3px 3px 0 2px var(--ink); }

  .tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .tool svg { width: 20px; height: 20px; fill: currentColor; }
  .tool {
    height: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border: var(--border);
    border-radius: var(--radius);
    background: var(--paper-light);
    color: var(--ink);
    font: 600 14px var(--font-body);
    cursor: pointer;
    touch-action: manipulation;
  }
  .tool .mark { background: currentColor; }
  .tool[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 var(--marigold); }

  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; padding: 0 8px; }
  .row .btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 var(--marigold); }
  .btn-danger { color: var(--kumkum); }

  .name { display: flex; flex-direction: column; gap: 2px; }

  /* done view */
  .done { display: flex; flex-direction: column; gap: 16px; max-width: 520px; margin: 0 auto; width: 100%; }
  .done h1 { margin: 6px 0 0; font: 400 34px/1.1 var(--font-display); }
  .done-mine { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: center; }
  .done-mine img { width: 112px; height: 112px; }
  .done-mine p { margin: 0; font-size: 17px; color: var(--ink-soft); }
  .done canvas { width: min(100%, 330px); aspect-ratio: 1; align-self: center; }
  .done .actions { display: flex; flex-direction: column; gap: 10px; }

  @media (min-width: 820px) and (min-height: 560px) {
    .workspace { flex-direction: row; align-items: flex-start; gap: 32px; }
    .stage { width: min(56vw, calc(100vh - 140px), 620px); margin: 0; flex: none; }
    .scroller { display: none; }
    .controls { flex: 1; min-width: 0; max-width: 380px; padding-top: 8px; }
    .hint { text-align: left; }
  }
</style>
</head>
<body>

<div class="grain" aria-hidden="true">
  <svg xmlns="http://www.w3.org/2000/svg"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" /></filter><rect width="100%" height="100%" filter="url(#grain)" /></svg>
</div>

<main class="page">
  <header class="brand">
    <img src="logo.png" alt="Chinmaya Mission Cleveland-Niagara" />
    <div class="brand-name">Petal Mandala</div>
  </header>
  <div class="strip" aria-hidden="true"></div>

  <section id="drawView" class="workspace">
    <div class="stage-row">
    <div class="stage" id="stage">
      <canvas id="base" aria-hidden="true"></canvas>
      <canvas id="ink" role="img" aria-label="Your rangoli. Draw with your finger or mouse; every stroke repeats in all 4 quarters."></canvas>
      <canvas id="guides" class="top" aria-hidden="true"></canvas>
    </div>
    <div class="scroller" aria-hidden="true">
      <svg viewBox="0 0 20 20"><path d="M5 12l5-5 5 5" /></svg>
      <span>Scroll here</span>
      <svg viewBox="0 0 20 20"><path d="M5 8l5 5 5-5" /></svg>
    </div>
    </div>

    <div class="controls">
      <p class="hint">Draw in one quarter and it repeats in all four. The <b>gold lines</b> are where your rangoli is cut.</p>

      <div class="swatches" role="group" aria-label="Colour" id="swatches"></div>

      <div class="tools" role="group" aria-label="Tool" id="tools">
        <button type="button" class="tool" data-tool="thin"><span class="mark" style="width:18px;height:3px;border-radius:2px"></span>Thin</button>
        <button type="button" class="tool" data-tool="brush" aria-pressed="true"><span class="mark" style="width:18px;height:6px;border-radius:3px"></span>Brush</button>
        <button type="button" class="tool" data-tool="thick"><span class="mark" style="width:18px;height:10px;border-radius:5px"></span>Thick</button>
        <button type="button" class="tool" data-tool="dot"><span class="mark" style="width:10px;height:10px;border-radius:50%"></span>Dot</button>
        <button type="button" class="tool" data-tool="petal"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 19C6 15 5.5 9 10 1c4.5 8 4 14 0 18z"/></svg>Petal</button>
        <button type="button" class="tool" data-tool="flower"><svg viewBox="0 0 20 20" aria-hidden="true"><path fill-rule="evenodd" d="M10 10C7 7 6 3 10 1c4 2 3 6 0 9zm0 0c3-3 7-4 9 0-2 4-6 3-9 0zm0 0c3 3 4 7 0 9-4-2-3-6 0-9zm0 0c-3 3-7 4-9 0 2-4 6-3 9 0z"/><circle cx="10" cy="10" r="1.3"/></svg>Flower</button>
        <button type="button" class="tool" data-tool="diya"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1c2.5 3 2.5 6 0 8-2.5-2-2.5-5 0-8zM2 11h16c-1 4-4 6-8 6s-7-2-8-6z"/></svg>Diya</button>
        <button type="button" class="tool" data-tool="mango"><svg viewBox="0 0 20 20" aria-hidden="true"><path fill-rule="evenodd" d="M9 19c-4 0-6-3-6-6 0-4 4-6 7-8 2-1.5 3-3 4-4 1 3 2 6 1 10-1 5-3 8-6 8zm0-3a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>Mango</button>
      </div>

      <div class="row">
        <button type="button" class="btn" id="eraser" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true" width="18" height="18" fill="currentColor"><path d="M12.6 2.6a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L10 14.8H17v1.7H6.8l-4.2-4.2a2 2 0 0 1 0-2.8zM5 9.9l-1.2 1.2 3.7 3.7H8l1.6-1.6z"/></svg>Eraser</button>
        <button type="button" class="btn" id="undo">Undo</button>
        <button type="button" class="btn btn-danger" id="clear">Start over</button>
      </div>

      <div class="name">
        <label for="name">Your name, if you’d like it shown</label>
        <input id="name" type="text" maxlength="30" autocomplete="given-name" placeholder="e.g. Asha" />
      </div>

      <p class="error" id="error" role="alert" hidden></p>
      <button type="button" class="btn btn-primary" id="submit">Add my rangoli</button>
    </div>
  </section>

  <section id="doneView" class="done" hidden>
    <h1>Your rangoli is in!</h1>
    <div class="done-mine">
      <img id="doneMine" alt="The rangoli you drew" />
      <p id="doneText">We cut it into 4 and placed the pieces around the mandala. They’re marked below.</p>
    </div>
    <canvas id="doneMap" role="img" aria-label="Map of the mandala with your 4 pieces marked"></canvas>
    <div class="actions">
      <a class="btn btn-primary" href="display/">See the whole mandala</a>
      <button type="button" class="btn" id="again">Draw another rangoli</button>
    </div>
  </section>
</main>

<script type="module" src="draw.js"></script>
</body>
</html>
